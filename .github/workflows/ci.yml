name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check (all modules importable)
        run: python -m compileall -q lakewind tests

      - name: Ruff (lint)
        run: ruff check lakewind tests --output-format=github

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build check
        run: docker build -t lakewind:ci .
